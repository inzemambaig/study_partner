<!doctype html><html><head><meta charset="utf-8"><title>Study Partner Settings</title><link rel="stylesheet" href="settings.css"></head><body><main><h1>Study Partner Settings</h1><form id="settings-form"><label>Transcription mode<select id="transcriptionMode"><option value="captions">Captions (no API key)</option><option value="whisper-groq">Whisper via Groq</option></select></label><label>Groq API key<input id="groqApiKey" type="password" placeholder="gsk_..."></label><label>Provider<select id="provider"><option>ollama</option><option>openai</option><option>anthropic</option><option>openrouter</option><option>custom</option></select></label><label>Model<input id="model" placeholder="llama3.2"></label><label>API key<input id="apiKey" type="password"></label><label>Base URL<input id="baseUrl" placeholder="http://localhost:11434"></label><label>Max tokens<input id="maxTokens" type="number" min="100" max="4000" step="100"></label><label>Temperature<input id="temperature" type="number" min="0" max="1" step="0.1"></label><label>Context window seconds<input id="contextWindowSeconds" type="number" min="30" step="30"></label><label>System prompt<textarea id="systemPrompt" rows="6"></textarea></label><label class="check"><input id="autoPauseOnQuery" type="checkbox"> Pause the video while asking a question</label><button type="submit">Save settings</button><output id="saved"></output></form></main><script type="module" src="settings.js"></script></body></html>
